name: build
on: [push]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
        # waiting on: https://github.com/actions/setup-node/issues/531
      - run: corepack enable
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: test built package on node@26
        working-directory: ./package-test/
        run: |
          pnpm install --frozen-lockfile

          node -v
          node test.cjs
          node test.mjs

      # lint comes after because the package-test directory needs to be
      # installed for the type-aware linting to work
      - run: pnpm lint

      # Not using a matrix here since it's simpler
      # to just duplicate it and not spawn new instances

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: test build package on node@24
        working-directory: ./package-test/
        run: |
          node -v
          node test.cjs
          node test.mjs

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: test build package on node@22
        working-directory: ./package-test/
        run: |
          node -v
          node test.cjs
          node test.mjs

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # required by zizmor-action to upload SARIF results
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.1
