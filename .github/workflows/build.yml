name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # waiting on: https://github.com/actions/setup-node/issues/531
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: test built package on node@24
        working-directory: ./package-test/
        run: |
          pnpm install --frozen-lockfile

          node -v
          node test.cjs
          node test.mjs

      # lint comes after because the package-test directory needs to be
      # installed for the type-aware linting to work
      - run: pnpm lint

      # Not using a matrix here since it's simpler
      # to just duplicate it and not spawn new instances

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: test build package on node@20
        working-directory: ./package-test/
        run: |
          node -v
          node test.cjs
          node test.mjs
