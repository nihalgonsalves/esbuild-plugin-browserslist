name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        # waiting on: https://github.com/actions/setup-node/issues/531
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: test built package on node@24
        working-directory: ./package-test/
        run: |
          pnpm install --frozen-lockfile

          node -v
          node test.cjs
          node test.mjs

      # lint comes after because the package-test directory needs to be
      # installed for the type-aware linting to work
      - run: pnpm lint

      # Not using a matrix here since it's simpler
      # to just duplicate it and not spawn new instances

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: test build package on node@20
        working-directory: ./package-test/
        run: |
          node -v
          node test.cjs
          node test.mjs
